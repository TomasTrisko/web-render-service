<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Technická podpora – VDF Games</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Technická podpora – VDF Games</h1>
    <p class="subtitle">Jak ti můžeme pomoct? Napiš, jaký máš problém.</p>

    <form id="question-form">
      <div class="form-group">
        <label for="question">Tvůj dotaz:</label>
        <textarea
          id="question"
          rows="5"
          placeholder="Např.: Po poslední aktualizaci se mi hra nespustí..."
          required
        ></textarea>
      </div>

      <div class="form-group">
        <label for="email">E-mail (nepovinné):</label>
        <input
          type="email"
          id="email"
          placeholder="tvuj@email.cz"
        >
      </div>

      <button type="submit" id="submit-btn">Odeslat dotaz</button>
    </form>

    <h2>Odpověď podpory:</h2>
    <div id="answer">Zatím žádný dotaz.</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
